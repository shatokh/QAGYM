name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.13.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm typecheck:web

      - name: Typecheck backend
        run: pnpm typecheck:api

      - name: Build frontend
        run: pnpm build:web

      - name: Build backend
        run: pnpm build:api

      - name: Validate Prisma schema
        run: pnpm db:validate
        env:
          DATABASE_URL: postgresql://qa_gym:qa_gym@localhost:5432/qa_comics_gym?schema=public

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet
